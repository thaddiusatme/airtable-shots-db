<!--
  Classic Polymer transcript panel (Feb-2026 DOM).
  Timestamp and text each render inside a span.yt-core-attributed-string.
-->
<div id="root">
  <ytd-transcript-segment-renderer class="style-scope ytd-transcript-segment-list-renderer">
    <div class="segment style-scope ytd-transcript-segment-renderer" role="button">
      <div class="segment-timestamp style-scope ytd-transcript-segment-renderer"><span class="yt-core-attributed-string">0:00</span></div>
      <yt-formatted-string class="segment-text style-scope ytd-transcript-segment-renderer"><span class="yt-core-attributed-string">Welcome to the classic transcript panel.</span></yt-formatted-string>
    </div>
  </ytd-transcript-segment-renderer>
  <ytd-transcript-segment-renderer class="style-scope ytd-transcript-segment-list-renderer">
    <div class="segment style-scope ytd-transcript-segment-renderer" role="button">
      <div class="segment-timestamp style-scope ytd-transcript-segment-renderer"><span class="yt-core-attributed-string">0:12</span></div>
      <yt-formatted-string class="segment-text style-scope ytd-transcript-segment-renderer"><span class="yt-core-attributed-string">This is the layout the extractor originally targeted.</span></yt-formatted-string>
    </div>
  </ytd-transcript-segment-renderer>
  <ytd-transcript-segment-renderer class="style-scope ytd-transcript-segment-list-renderer">
    <div class="segment style-scope ytd-transcript-segment-renderer" role="button">
      <div class="segment-timestamp style-scope ytd-transcript-segment-renderer"><span class="yt-core-attributed-string">1:02:03</span></div>
      <yt-formatted-string class="segment-text style-scope ytd-transcript-segment-renderer"><span class="yt-core-attributed-string">Timestamps past an hour use H:MM:SS.</span></yt-formatted-string>
    </div>
  </ytd-transcript-segment-renderer>
</div>
